<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>📚 图书馆智能助手</title>
<style>
  :root {
    --bg: #f5f6f8; --panel: #ffffff; --border: #e4e7ec;
    --text: #1f2329; --muted: #8a919f; --primary: #3b7cff;
    --user-bg: #e8f0fe; --ai-bg: #f0f1f4; --tool-bg: #fafbfc;
    --ok: #16a34a; --warn: #d97706; --err: #dc2626;
    --radius: 12px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
    background: var(--bg); color: var(--text); height: 100vh; display: flex;
    flex-direction: column;
  }
  header {
    background: var(--panel); border-bottom: 1px solid var(--border);
    padding: 12px 20px; display: flex; align-items: center; gap: 12px;
    position: sticky; top: 0; z-index: 10;
  }
  header h1 { font-size: 17px; font-weight: 600; flex: 1; white-space: nowrap; }
  header .badge {
    font-size: 12px; color: var(--muted); background: var(--tool-bg);
    border: 1px solid var(--border); border-radius: 999px; padding: 3px 10px;
  }
  header select {
    font-size: 14px; padding: 6px 10px; border-radius: 8px;
    border: 1px solid var(--border); background: var(--panel); color: var(--text);
    outline: none; cursor: pointer;
  }
  header select:focus { border-color: var(--primary); }

  main { flex: 1; overflow-y: auto; padding: 20px 0 8px; }
  .chat { max-width: 880px; margin: 0 auto; padding: 0 16px; display: flex;
    flex-direction: column; gap: 14px; }
  .msg { display: flex; flex-direction: column; max-width: 82%; }
  .msg .who { font-size: 12px; color: var(--muted); margin-bottom: 4px; }
  .msg .bubble {
    padding: 10px 14px; border-radius: var(--radius); line-height: 1.65;
    font-size: 14.5px; white-space: pre-wrap; word-break: break-word;
  }
  .msg.user { align-self: flex-end; align-items: flex-end; }
  .msg.user .bubble { background: var(--user-bg); border-bottom-right-radius: 4px; }
  .msg.ai { align-self: flex-start; align-items: flex-start; }
  .msg.ai .bubble { background: var(--ai-bg); border-bottom-left-radius: 4px; }
  .msg.ai .bubble.typing::after {
    content: "▍"; color: var(--primary); animation: blink 0.9s steps(2) infinite;
  }
  @keyframes blink { 50% { opacity: 0; } }

  /* 工具卡片 */
  .toolcard {
    align-self: flex-start; max-width: 88%; background: var(--tool-bg);
    border: 1px solid var(--border); border-radius: var(--radius);
    padding: 10px 14px; font-size: 13px; width: 100%;
  }
  .toolcard .row1 { display: flex; align-items: center; gap: 8px; }
  .toolcard .tname {
    font-weight: 600; font-size: 13.5px; font-family: "SF Mono", Consolas, monospace;
  }
  .toolcard .tstate { margin-left: auto; font-size: 12px; color: var(--muted); }
  .toolcard .tstate.ok { color: var(--ok); }
  .toolcard .tstate.err { color: var(--err); }
  .toolcard details { margin-top: 8px; }
  .toolcard summary {
    cursor: pointer; font-size: 12px; color: var(--muted); user-select: none;
  }
  .toolcard pre {
    margin-top: 6px; background: var(--panel); border: 1px solid var(--border);
    border-radius: 8px; padding: 8px 10px; font-size: 12px;
    max-height: 180px; overflow: auto; white-space: pre-wrap; word-break: break-all;
  }
  .toolcard .result-summary {
    margin-top: 6px; font-size: 12.5px; color: var(--muted);
    display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .toolcard.error { border-color: #f3c4c4; background: #fef7f7; }

  /* 输入区 */
  footer {
    background: var(--panel); border-top: 1px solid var(--border); padding: 12px 16px 16px;
  }
  .composer { max-width: 880px; margin: 0 auto; display: flex; flex-direction: column; gap: 10px; }
  .suggestions { display: flex; gap: 8px; flex-wrap: wrap; }
  .suggestions button {
    font-size: 12.5px; color: var(--primary); background: var(--panel);
    border: 1px solid var(--border); border-radius: 999px; padding: 5px 12px;
    cursor: pointer; transition: all .15s;
  }
  .suggestions button:hover { border-color: var(--primary); background: var(--user-bg); }
  .inputrow { display: flex; gap: 10px; }
  .inputrow input {
    flex: 1; padding: 11px 14px; font-size: 14.5px; border-radius: 10px;
    border: 1px solid var(--border); background: var(--bg); color: var(--text);
    outline: none; transition: border .15s;
  }
  .inputrow input:focus { border-color: var(--primary); background: var(--panel); }
  .inputrow button {
    padding: 11px 22px; font-size: 14.5px; border: none; border-radius: 10px;
    background: var(--primary); color: #fff; cursor: pointer; font-weight: 500;
    transition: opacity .15s;
  }
  .inputrow button:disabled { opacity: .5; cursor: not-allowed; }

  .empty-tip {
    text-align: center; color: var(--muted); margin-top: 12vh; font-size: 14px;
  }
  .empty-tip .big { font-size: 42px; display: block; margin-bottom: 12px; }
</style>
</head>
<body>
<header>
  <h1>📚 图书馆智能助手</h1>
  <span class="badge" id="providerBadge">连接中…</span>
  <select id="patronSelect" title="切换当前读者"></select>
</header>

<main>
  <div class="chat" id="chat">
    <div class="empty-tip">
      <span class="big">📚</span>
      你好，我是图书馆智能助手。<br>
      可以让我帮你查书、借书、还书、续借、预约，或查询罚款。<br>
      <span style="color:#b6bcc7;font-size:13px">例如：「帮我查一下《三体》」「我有什么书快到期了」「续借我借的那本书」</span>
    </div>
  </div>
</main>

<footer>
  <div class="composer">
    <div class="suggestions" id="suggestions"></div>
    <div class="inputrow">
      <input id="input" type="text" placeholder="输入你的问题，例如：帮我续借《活着》" autocomplete="off">
      <button id="send">发送</button>
    </div>
  </div>
</footer>

<script>
"use strict";
const $ = s => document.querySelector(s);
const chat = $("#chat"), input = $("#input"), sendBtn = $("#send");
let currentPatron = null, busy = false;

const SUGGESTIONS = [
  "帮我查一下《三体》",
  "我借了什么书？",
  "我有什么书快到期了",
  "帮我续借一本",
  "我有逾期罚款吗？",
  "帮我预约《三体》"
];

/* ---------- 初始化 ---------- */
async function init() {
  try {
    const [patrons, health] = await Promise.all([
      fetch("/api/patrons").then(r => r.json()),
      fetch("/api/health").then(r => r.json())
    ]);
    const sel = $("#patronSelect");
    sel.innerHTML = "";
    for (const p of patrons) {
      const opt = document.createElement("option");
      opt.value = p.id;
      opt.textContent = `${p.name}（${p.barcode}）`;
      sel.appendChild(opt);
    }
    currentPatron = patrons[0] || null;
    $("#providerBadge").textContent = "LLM: " + (health.provider || "mock") +
      ` · 藏书 ${health.books || 0} 本`;
    if (health.provider === "mock") {
      $("#providerBadge").textContent += " · 演示模式";
    }
  } catch (e) {
    $("#providerBadge").textContent = "服务未连接";
  }
  sel.onchange = () => {
    currentPatron = { id: +sel.value, name: sel.options[sel.selectedIndex].text.split("（")[0] };
  };
  const sug = $("#suggestions");
  SUGGESTIONS.forEach(s => {
    const b = document.createElement("button");
    b.textContent = s;
    b.onclick = () => { input.value = s; send(); };
    sug.appendChild(b);
  });
}
init();

/* ---------- 消息渲染 ---------- */
function addMsg(role, text) {
  const el = document.createElement("div");
  el.className = "msg " + role;
  el.innerHTML = `<div class="who">${role === "user" ? "我" : "图书馆助手"}</div>
                  <div class="bubble${role === "ai" ? " typing" : ""}"></div>`;
  el.querySelector(".bubble").textContent = text || "";
  chat.appendChild(el);
  scrollBottom();
  return el;
}

function addToolCard() {
  const el = document.createElement("div");
  el.className = "toolcard";
  el.innerHTML = `
    <div class="row1"><span class="tname"></span><span class="tstate">执行中…</span></div>
    <details><summary>查看参数</summary><pre class="args"></pre></details>
    <div class="result-summary"></div>`;
  chat.appendChild(el);
  scrollBottom();
  return el;
}

function scrollBottom() {
  const main = document.querySelector("main");
  main.scrollTop = main.scrollHeight;
}

/* ---------- 发送与 SSE 解析 ---------- */
async function send() {
  const msg = input.value.trim();
  if (!msg || busy) return;
  if (!currentPatron) { alert("请先选择读者"); return; }
  busy = true; sendBtn.disabled = true; input.value = "";

  // 隐藏空态提示
  const tip = chat.querySelector(".empty-tip");
  if (tip) tip.remove();

  addMsg("user", msg);
  let aiEl = addMsg("ai", "");
  const aiBubble = aiEl.querySelector(".bubble");

  try {
    const resp = await fetch("/api/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ message: msg, patron_id: currentPatron.id })
    });
    if (!resp.ok) {
      const err = await resp.json().catch(() => ({}));
      throw new Error(err.error || "请求失败 (" + resp.status + ")");
    }
    const reader = resp.body.getReader();
    const decoder = new TextDecoder();
    let buf = "", toolCards = {};

    const handleEvent = (type, data) => {
      switch (type) {
        case "message":
          aiBubble.classList.add("typing");
          aiBubble.textContent += data.delta || "";
          scrollBottom();
          break;
        case "tool_call":
          aiBubble.classList.remove("typing");
          const card = addToolCard();
          card.querySelector(".tname").textContent = "🛠 " + data.name;
          card.querySelector(".args").textContent =
            prettyJSON(data.arguments);
          card.dataset.id = data.id;
          toolCards[data.id] = card;
          if (data.mock) card.querySelector(".tstate").textContent = "演示模式";
          break;
        case "tool_result": {
          const card = toolCards[data.id];
          if (card) {
            card.querySelector(".tstate").textContent = data.error ? "失败" : "完成";
            card.querySelector(".tstate").className = "tstate " + (data.error ? "err" : "ok");
            if (data.error) {
              card.classList.add("error");
              card.querySelector(".result-summary").textContent = "⚠️ " + data.error;
            } else {
              card.querySelector(".result-summary").textContent = summarize(data.result);
            }
            card.querySelector(".result-summary").title = prettyJSON(data.result);
          }
          scrollBottom();
          break;
        }
        case "done":
          aiBubble.classList.remove("typing");
          break;
        case "error":
          aiBubble.classList.remove("typing");
          aiBubble.textContent += "\n⚠️ " + (data.message || "发生错误");
          break;
      }
    };

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += decoder.decode(value, { stream: true });
      // 按 SSE 空行切块
      let idx;
      while ((idx = buf.indexOf("\n\n")) !== -1) {
        const block = buf.slice(0, idx);
        buf = buf.slice(idx + 2);
        let type = null, dataStr = "";
        for (const line of block.split("\n")) {
          if (line.startsWith("event:")) type = line.slice(6).trim();
          else if (line.startsWith("data:")) dataStr += line.slice(5).trim();
        }
        if (type && dataStr) {
          try { handleEvent(type, JSON.parse(dataStr)); }
          catch (e) { console.warn("事件解析失败", e); }
        }
      }
    }
    aiBubble.classList.remove("typing");
  } catch (e) {
    aiBubble.classList.remove("typing");
    aiBubble.textContent += "\n⚠️ " + e.message;
  } finally {
    busy = false; sendBtn.disabled = false; input.focus();
  }
}

/* ---------- 工具 ---------- */
function prettyJSON(s) {
  try {
    const v = typeof s === "string" ? JSON.parse(s) : s;
    return JSON.stringify(v, null, 2);
  } catch { return String(s); }
}
function summarize(result) {
  if (!result) return "完成";
  try {
    const v = typeof result === "string" ? JSON.parse(result) : result;
    if (Array.isArray(v)) return `返回 ${v.length} 条结果`;
    if (v.message) return v.message;
    if (v.unpaid_yuan !== undefined) return `未缴罚款 ${v.unpaid_yuan} 元`;
    if (v.loan) return `应还日期 ${v.loan.due_date}`;
    if (v.hold) return `排队第 ${v.hold.queue_pos} 位`;
    return prettyJSON(v);
  } catch { return prettyJSON(result); }
}

input.addEventListener("keydown", e => { if (e.key === "Enter") send(); });
sendBtn.onclick = send;
</script>
</body>
</html>
